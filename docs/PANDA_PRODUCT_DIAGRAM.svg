nt-family="Arial,Helvetica,sans-serif" font-size="18" fill="#18372f" font-weight="700">Session workflow</text><text x="1084" y="629" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#587167" font-weight="400">Read approved plan → start → finish once</text><text x="1084" y="651" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#587167" font-weight="400">Saved report and patient history</text><text x="1084" y="678" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#18372f" font-weight="700">Own records</text><text x="1084" y="703" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#587167" font-weight="400">Sessions, measurements, immutable reports</text><text x="1084" y="725" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#587167" font-weight="400">Model assets and tracking tests</text><text x="60" y="799" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#587167" font-weight="700">INTEGRATION CONTRACTS / HTTP, not shared database writes</text><path d="M760,858 L298,858" stroke="#527267" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><text x="325" y="843" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#18372f" font-weight="400">Approved plan + task / help status</text><path d="M840,858 L1302,858" stroke="#527267" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><text x="899" y="843" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#18372f" font-weight="400">Approved plan + version</text><path d="M298,926 L760,926" stroke="#527267" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><text x="326" y="911" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#18372f" font-weight="400">Confirmed task / help request</text><path d="M1302,926 L840,926" stroke="#527267" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><text x="925" y="911" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#18372f" font-weight="400">Saved 